<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Proposal Expired — Metodas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root {
  color-scheme: light dark;
  --ink: #1c1a17; --paper: #f7f4ee; --accent: #a3311a; --accent-2: #d9714a;
  --ink-55: rgba(28,26,23,0.64); --ink-06: rgba(28,26,23,0.06);
  --paper-r: 247; --paper-g: 244; --paper-b: 238;
  --pad-x: clamp(20px, 4vw, 48px);
  --dark-bg: #221f1b; --dark-line: rgba(247,244,238,0.12);
  --fixed-cream: #f7f4ee; --fixed-cream-55: rgba(247,244,238,0.55);
}
@media (prefers-color-scheme: dark) {
  :root { --ink: #f2ede4; --paper: #171512; --accent: #d9714a; --accent-2: #a3311a; --ink-55: rgba(242,237,228,0.55); --ink-06: rgba(242,237,228,0.06); --paper-r: 23; --paper-g: 21; --paper-b: 18; --dark-bg: #0a0908; --dark-line: rgba(247,244,238,0.10); }
}
:root[data-theme="light"] { --ink: #1c1a17; --paper: #f7f4ee; --accent: #a3311a; --accent-2: #d9714a; --ink-55: rgba(28,26,23,0.64); --ink-06: rgba(28,26,23,0.06); --paper-r: 247; --paper-g: 244; --paper-b: 238; --dark-bg: #221f1b; --dark-line: rgba(247,244,238,0.12); }
:root[data-theme="dark"] { --ink: #f2ede4; --paper: #171512; --accent: #d9714a; --accent-2: #a3311a; --ink-55: rgba(242,237,228,0.55); --ink-06: rgba(242,237,228,0.06); --paper-r: 23; --paper-g: 21; --paper-b: 18; --dark-bg: #0a0908; --dark-line: rgba(247,244,238,0.10); }
*, *::before, *::after { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:'Space Grotesk', system-ui, sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
p, h1 { margin:0; }
.inner { max-width:1200px; margin:0 auto; padding:0 var(--pad-x); }

.site-nav { position:sticky; top:0; z-index:100; background:rgba(var(--paper-r),var(--paper-g),var(--paper-b),0.86); backdrop-filter:blur(14px); border-bottom:1px solid var(--ink-06); }
.nav-inner { max-width:1200px; margin:0 auto; padding:16px var(--pad-x); display:flex; align-items:center; justify-content:space-between; gap:24px; }
.nav-logo { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; letter-spacing:-0.02em; }
.nav-logo img { height:34px; width:auto; display:block; }
.nav-logo img.logo-dark { display:none; }
@media (prefers-color-scheme: dark) { .nav-logo img.logo-light{display:none;} .nav-logo img.logo-dark{display:block;} }
:root[data-theme="light"] .nav-logo img.logo-light { display:block; }
:root[data-theme="light"] .nav-logo img.logo-dark { display:none; }
:root[data-theme="dark"] .nav-logo img.logo-light { display:none; }
:root[data-theme="dark"] .nav-logo img.logo-dark { display:block; }
.theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:46px; height:46px; border:1px solid var(--ink-06); background:transparent; color:var(--ink); cursor:pointer; }
.theme-toggle svg { width:19px; height:19px; display:block; }
.theme-toggle .icon-moon { display:none; }
@media (prefers-color-scheme: dark) { .theme-toggle .icon-sun { display:none; } .theme-toggle .icon-moon { display:block; } }
:root[data-theme="light"] .theme-toggle .icon-sun { display:block; }
:root[data-theme="light"] .theme-toggle .icon-moon { display:none; }
:root[data-theme="dark"] .theme-toggle .icon-sun { display:none; }
:root[data-theme="dark"] .theme-toggle .icon-moon { display:block; }

.expired { min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:96px var(--pad-x); }
.expired-h1 { font-size:clamp(26px,3.2vw,40px); font-weight:700; letter-spacing:-0.025em; line-height:1.2; max-width:600px; }
.expired-sub { font-size:17px; color:var(--ink-55); line-height:1.7; max-width:480px; margin-top:16px; }
.expired-btn { display:inline-block; margin-top:32px; padding:12px 24px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; letter-spacing:-0.01em; }
.expired-btn:hover { background:var(--accent-2); }

.site-footer { border-top:1px solid var(--dark-line); background:var(--dark-bg); padding:56px 0 28px; color:var(--fixed-cream); }
.footer-top { display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:32px; padding-bottom:32px; border-bottom:1px solid var(--dark-line); margin-bottom:24px; }
.footer-logo { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:700; letter-spacing:-0.02em; color:var(--fixed-cream); }
.footer-logo img { height:26px; width:auto; display:block; }
.footer-nav { display:flex; flex-direction:column; gap:12px; }
.footer-col-label { font-size:11px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--fixed-cream-55); margin-bottom:6px; }
.footer-link { font-size:13px; color:var(--fixed-cream-55); }
.footer-link:hover { color:var(--fixed-cream); }
.footer-bottom { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
.footer-legal-links { display:flex; gap:16px; }
.footer-legal-links a { font-size:12px; color:var(--fixed-cream-55); }
.footer-legal-links a:hover { color:var(--fixed-cream); }
.footer-copy { font-size:12px; color:var(--fixed-cream-55); }
@media (max-width:640px){ .footer-top{grid-template-columns:1fr;} }
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html#top" class="nav-logo"><img class="logo-light" src="Assets/Images/Logo/metodas-mark-black.png" alt=""><img class="logo-dark" src="Assets/Images/Logo/metodas-mark-white.png" alt="">Metodas</a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">
      <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.3"/><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><line x1="8" y1="0.8" x2="8" y2="2.4"/><line x1="8" y1="13.6" x2="8" y2="15.2"/><line x1="0.8" y1="8" x2="2.4" y2="8"/><line x1="13.6" y1="8" x2="15.2" y2="8"/><line x1="2.6" y1="2.6" x2="3.7" y2="3.7"/><line x1="12.3" y1="12.3" x2="13.4" y2="13.4"/><line x1="2.6" y1="13.4" x2="3.7" y2="12.3"/><line x1="12.3" y1="3.7" x2="13.4" y2="2.6"/></g></svg>
      <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 9.8A6 6 0 1 1 6.2 2.8a6.6 6.6 0 1 0 7 7z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main>
<section class="expired">
  <h1 class="expired-h1">Oops! This proposal link has expired.</h1>
  <p class="expired-sub">This page is no longer active. If you're still interested in this mandate, feel free to reach out.</p>
  <a class="expired-btn" href="index.html#top">Back to homepage</a>
</section>
</main>

<footer class="site-footer">
  <div class="inner" style="padding-top:0; padding-bottom:0;">
    <div class="footer-top">
      <a href="index.html#top" class="footer-logo"><img src="Assets/Images/Logo/metodas-mark-white.png" alt="">Metodas</a>
      <div class="footer-nav">
        <p class="footer-col-label">Navigate</p>
        <a href="index.html#talent" class="footer-link">Talent</a>
        <a href="index.html#vetting" class="footer-link">Vetting</a>
      </div>
      <div class="footer-nav">
        <p class="footer-col-label">&nbsp;</p>
        <a href="index.html#cases" class="footer-link">Cases</a>
        <a href="index.html#pricing" class="footer-link">Pricing</a>
      </div>
    </div>
    <div class="footer-bottom">
      <p class="footer-copy">&copy; 2026 Metodas. All rights reserved.</p>
      <div class="footer-legal-links">
        <a href="terms-of-service.html">Terms of Service</a>
        <a href="privacy-policy.html">Privacy Policy</a>
      </div>
    </div>
  </div>
</footer>

<script>
const themeToggle = document.getElementById('themeToggle');
const root = document.documentElement;
const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
let currentTheme = systemPrefersDark ? 'dark' : 'light';
themeToggle.addEventListener('click', () => {
  currentTheme = currentTheme === 'light' ? 'dark' : 'light';
  root.setAttribute('data-theme', currentTheme);
});
</script>

</body>
</html>
